[project]
name = "plastic-surgery-skill"
version = "1.4.0"
description = "Tactile 2D UI and 3D Three.js visual overhaul skill with zero-mutation static and glTF preflight linters."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C901", "EXE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/conform.py" = ["BLE001"]
